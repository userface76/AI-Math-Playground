<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RUN 1000 Prototype</title>
<style>
:root{--ink:#1f2450;--accent:#6d5ce8;--pink:#ff5f9e;--card:#ffffffed}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#8fd6ff,#eef6ff);color:var(--ink)}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:14px 14px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top a{color:#51459c;text-decoration:none;font-weight:900}
.badge{background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;box-shadow:0 6px 20px #30408022}
.hero{margin:12px 0;background:#ffffffc9;border-radius:24px;padding:16px;box-shadow:0 16px 38px #40508022}.hero h1{margin:2px 0 4px;font-size:28px}.hero p{margin:0;color:#6f7192;font-size:13px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.char{border:2px solid transparent;background:#f6f4ff;border-radius:18px;padding:12px;font-size:15px;font-weight:900;color:#443a91}.char span{display:block;font-size:34px}.char.active{border-color:#6d5ce8;background:#ece9ff}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.hud div{background:var(--card);border-radius:14px;padding:9px;text-align:center;font-size:11px}.hud b{display:block;font-size:18px}
.game{position:relative;background:linear-gradient(#7fcaff,#8ed3a5 28%,#c7aa79 29%,#8a6e53);border:4px solid #fff;border-radius:26px;overflow:hidden;box-shadow:0 15px 35px #263b7525}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#17204455;backdrop-filter:blur(3px);padding:20px}.overlay.hidden{display:none}.panel{width:100%;background:#fff;border-radius:22px;padding:18px;text-align:center}.panel h2{margin:0 0 6px}.panel p{margin:0 0 14px;color:#6d6e86;font-size:13px;line-height:1.5}
.btn{width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(135deg,#6d5ce8,#9c77ef);color:#fff;font-weight:900;font-size:16px;box-shadow:0 5px 0 #5143b5}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.control{border:0;border-radius:18px;padding:15px;background:#fff;color:#493e91;font-size:24px;font-weight:1000;box-shadow:0 5px 0 #dcd6fa}.hint{margin-top:10px;text-align:center;font-size:11px;color:#656b86}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../../">‹ AI Math Playground</a><div class="badge">MINI APP PROTOTYPE</div></div>
  <div class="hero">
    <h1>🏃 RUN 1000</h1>
    <p>게이트를 골라 파워를 키우고 1000단계까지 달려보자.</p>
    <div class="pick">
      <button class="char active" data-char="boy"><span>🧑‍🚀</span>남자 러너</button>
      <button class="char" data-char="girl"><span>👩‍🚀</span>여자 러너</button>
    </div>
  </div>
  <div class="hud">
    <div>STAGE<b id="stage">1 / 1000</b></div>
    <div>POWER<b id="power">5</b></div>
    <div>DISTANCE<b id="dist">0%</b></div>
  </div>
  <div class="game">
    <canvas id="game" width="420" height="700"></canvas>
    <div id="overlay" class="overlay">
      <div class="panel"><h2 id="title">1단계 준비!</h2><p id="msg">좋은 게이트를 골라 파워를 키워보세요.<br>좌우 버튼이나 화면 스와이프로 이동합니다.</p><button id="start" class="btn">달리기 시작</button></div>
    </div>
  </div>
  <div class="controls"><button id="left" class="control">◀</button><button id="right" class="control">▶</button></div>
  <div class="hint">좋은 게이트는 파워를 올리고, 장애물은 파워를 줄여요.</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let stage=Math.max(1,Math.min(1000,Number(localStorage.getItem('run1000Stage')||1)));
let character='boy',lane=1,power=5,running=false,progress=0,last=0,objects=[],speed=135,spawnIndex=0;
const lanes=[105,210,315],courseLength=2100;
const colors=['#5fd36b','#6ab5ff','#ffca52','#ff7c91'];

function rng(seed){let x=Math.sin(seed*999.91)*10000;return x-Math.floor(x)}
function makeCourse(){
  objects=[];spawnIndex=0;
  const count=9+Math.min(8,Math.floor(stage/60));
  for(let i=0;i<count;i++){
    const z=260+i*190;
    const r=rng(stage*31+i*7);
    if(i%3===2&&r<.55){
      objects.push({type:'obstacle',lane:Math.floor(rng(stage+i*13)*3),z,hit:false});
    }else{
      let a=Math.floor(rng(stage+i*5)*3),b=(a+1+Math.floor(rng(stage+i*9)*2))%3;
      const mult=stage>15&&rng(stage+i*17)>.64;
      objects.push({type:'gate',lane:a,z,op:mult?'×':'+',value:mult?(rng(i+stage)>.55?3:2):(2+Math.floor(rng(stage+i*21)*6)),hit:false});
      objects.push({type:'gate',lane:b,z,op:'+',value:1+Math.floor(rng(stage+i*23)*4),hit:false});
    }
  }
}
function reset(){
  lane=1;power=5+Math.floor((stage-1)/50);progress=0;speed=135+Math.min(75,stage*.08);makeCourse();updateHud();
}
function updateHud(){$('stage').textContent=stage+' / 1000';$('power').textContent=power;$('dist').textContent=Math.min(100,Math.floor(progress/courseLength*100))+'%'}
function start(){
  reset();running=true;last=performance.now();$('overlay').classList.add('hidden');requestAnimationFrame(loop)
}
function move(dir){if(!running)return;lane=Math.max(0,Math.min(2,lane+dir))}
function project(z){const rel=z-progress;const t=1-Math.max(0,Math.min(1,rel/720));const y=120+t*520;const scale=.35+t*.9;return{y,scale}}
function drawRoad(){
  ctx.clearRect(0,0,420,700);
  const g=ctx.createLinearGradient(0,0,0,700);g.addColorStop(0,'#79cfff');g.addColorStop(.3,'#bcefff');g.addColorStop(.31,'#91cb78');g.addColorStop(1,'#7a6450');ctx.fillStyle=g;ctx.fillRect(0,0,420,700);
  ctx.fillStyle='#6c5949';ctx.beginPath();ctx.moveTo(150,120);ctx.lineTo(10,700);ctx.lineTo(410,700);ctx.lineTo(270,120);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffffff88';ctx.lineWidth=4;for(const x of [180,240]){ctx.beginPath();ctx.moveTo(210+(x-210)*.25,120);ctx.lineTo(x+(x-210)*1.7,700);ctx.stroke()}
}
function drawObject(o){
  const p=project(o.z);if(o.z-progress< -80||o.z-progress>760)return;
  const x=lanes[o.lane],w=70*p.scale,h=54*p.scale;
  if(o.type==='gate'){
    ctx.fillStyle=o.op==='×'?'#65b6ff':'#65d676';ctx.globalAlpha=o.hit?.25:1;ctx.fillRect(x-w/2,p.y-h/2,w,h);ctx.fillStyle='#fff';ctx.font='900 '+Math.max(14,28*p.scale)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.op+o.value,x,p.y);ctx.globalAlpha=1;
  }else{
    ctx.fillStyle='#e84e4e';ctx.globalAlpha=o.hit?.25:1;ctx.fillRect(x-w/2,p.y-h/2,w,h);ctx.fillStyle='#fff';ctx.font='900 '+Math.max(13,24*p.scale)+'px system-ui';ctx.textAlign='center';ctx.fillText('⚠',x,p.y);ctx.globalAlpha=1;
  }
}
function drawRunner(){
  const x=lanes[lane],y=590;ctx.save();ctx.translate(x,y);
  ctx.fillStyle=character==='girl'?'#ff5f9e':'#5968f2';ctx.beginPath();ctx.arc(0,-30,18,0,Math.PI*2);ctx.fill();ctx.fillRect(-16,-12,32,42);
  ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-8,30);ctx.lineTo(-18,52);ctx.moveTo(8,30);ctx.lineTo(18,52);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='900 14px system-ui';ctx.textAlign='center';ctx.fillText(power,0,2);ctx.restore()
}
function collide(){
  for(const o of objects){if(o.hit)continue;const dz=o.z-progress;if(dz<55&&dz>-15&&o.lane===lane){o.hit=true;if(o.type==='gate'){power=o.op==='×'?power*o.value:power+o.value}else{power=Math.max(1,power-3)}updateHud()}}
}
function finish(){
  running=false;const boss=12+Math.floor(stage*1.35);
  const win=power>=boss;
  $('title').textContent=win?'🎉 스테이지 클리어!':'💥 조금 부족해!';
  $('msg').innerHTML='내 파워 <b>'+power+'</b> · 목표 파워 <b>'+boss+'</b><br>'+(win?(stage<1000?'다음 단계로 이동합니다.':'1000단계 완주!'):'게이트 조합을 바꿔 다시 도전해보세요.');
  $('start').textContent=win&&stage<1000?'다음 단계':'다시 도전';
  if(win&&stage<1000){stage++;localStorage.setItem('run1000Stage',stage)}
  $('overlay').classList.remove('hidden');updateHud()
}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;progress+=speed*dt;collide();drawRoad();[...objects].sort((a,b)=>b.z-a.z).forEach(drawObject);drawRunner();updateHud();if(progress>=courseLength){finish();return}requestAnimationFrame(loop)}
document.querySelectorAll('.char').forEach(b=>b.addEventListener('click',()=>{character=b.dataset.char;document.querySelectorAll('.char').forEach(x=>x.classList.toggle('active',x===b))}));
$('start').addEventListener('click',start);$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));
let sx=null;canvas.addEventListener('pointerdown',e=>sx=e.clientX);canvas.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>25)move(dx>0?1:-1);sx=null});
reset();drawRoad();drawRunner();
})();
</script>
</body></html>
