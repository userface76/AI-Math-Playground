<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOB BLASTER</title>
<style>
:root{--ink:#20264e;--accent:#6556e8;--pink:#ff5f9e;--good:#58cb76;--bad:#f06464}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#9ddcff,#f1f7ff);color:var(--ink)}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:14px 14px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top a{text-decoration:none;color:#51459c;font-weight:900}.badge{background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}
.hero{margin:12px 0;background:#ffffffd8;border-radius:24px;padding:16px;box-shadow:0 15px 36px #30408020}.hero h1{margin:0 0 4px;font-size:28px}.hero p{margin:0;color:#6b718e;font-size:13px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.hud div{background:#ffffffeb;border-radius:14px;padding:9px;text-align:center;font-size:11px}.hud b{display:block;font-size:18px}
.game{position:relative;border:4px solid #fff;border-radius:26px;overflow:hidden;box-shadow:0 16px 36px #30407028;background:#8fd5ff}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#13214a66;padding:20px}.overlay.hidden{display:none}.panel{background:#fff;width:100%;border-radius:22px;padding:18px;text-align:center}.panel h2{margin:0 0 6px}.panel p{margin:0 0 14px;color:#686f88;font-size:13px;line-height:1.5}
.btn{width:100%;border:0;border-radius:16px;padding:14px;background:linear-gradient(135deg,#6556e8,#9a78ef);color:#fff;font-weight:900;font-size:16px;box-shadow:0 5px 0 #4e40b4}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.control{border:0;border-radius:18px;padding:15px;background:#fff;color:#493d91;font-size:23px;font-weight:1000;box-shadow:0 5px 0 #dcd6fa}
.note{margin-top:10px;text-align:center;color:#68708a;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../../">‹ AI Math Playground</a><div class="badge">SHOOTING MINI APP</div></div>
  <div class="hero"><h1>💥 MOB BLASTER</h1><p>게이트로 화력을 키우고 적 타워를 부숴라!</p></div>
  <div class="hud">
    <div>STAGE<b id="stage">1</b></div>
    <div>POWER<b id="power">10</b></div>
    <div>TARGET<b id="target">40</b></div>
  </div>
  <div class="game">
    <canvas id="game" width="420" height="700"></canvas>
    <div id="overlay" class="overlay">
      <div class="panel"><h2 id="title">1단계 준비!</h2><p id="msg">좋은 게이트를 골라 화력을 키우세요.<br>빨간 마이너스 게이트는 피하는 게 좋아요.</p><button id="start" class="btn">전투 시작</button></div>
    </div>
  </div>
  <div class="controls"><button id="left" class="control">◀</button><button id="right" class="control">▶</button></div>
  <div class="note">자동 발사 · 좌우 이동 · + / × / - / ÷ 게이트</div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);
let stage=1,lane=1,power=10,target=40,running=false,progress=0,last=0,speed=128,bullets=[],gates=[],enemies=[],fx=[];
const lanes=[105,210,315],length=2200;
function rnd(seed){const v=Math.sin(seed*999.13)*10000;return v-Math.floor(v)}
function makeStage(){
 gates=[];enemies=[];bullets=[];fx=[];
 const waves=8+Math.min(5,Math.floor(stage/8));
 for(let i=0;i<waves;i++){
  const z=260+i*210,base=stage*41+i*17;
  const goodLane=Math.floor(rnd(base)*3),alt=(goodLane+1+Math.floor(rnd(base+5)*2))%3;
  const strong=stage>4&&rnd(base+9)>.58;
  gates.push({lane:goodLane,z,op:strong?'×':'+',v:strong?(rnd(base+11)>.5?3:2):(2+Math.floor(rnd(base+13)*7)),used:false});
  const badType=rnd(base+15);
  gates.push({lane:alt,z,op:badType>.5?'-':'÷',v:badType>.5?(2+Math.floor(rnd(base+19)*6)):2,used:false});
  if(i%2===1)enemies.push({lane:Math.floor(rnd(base+21)*3),z:z+105,hp:8+Math.floor(stage*1.8)+i*2,hit:false});
 }
 target=35+Math.floor(stage*6.5);$('target').textContent=target;
}
function reset(){lane=1;power=10+Math.floor(stage/5);progress=0;speed=128+Math.min(45,stage*.9);makeStage();updateHud()}
function updateHud(){$('stage').textContent=stage;$('power').textContent=Math.max(0,Math.floor(power));$('target').textContent=target}
function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}
function project(z){const rel=z-progress,t=1-Math.max(0,Math.min(1,rel/760));return{y:115+t*520,s:.34+t*.95}}
function fire(dt){
 fire.acc=(fire.acc||0)+dt;
 if(fire.acc>.12){fire.acc=0;bullets.push({lane,z:progress+40})}
 bullets.forEach(b=>b.z+=380*dt);
 bullets=bullets.filter(b=>b.z<progress+800);
}
function collide(){
 for(const g of gates){if(g.used)continue;const dz=g.z-progress;if(dz<45&&dz>-15&&g.lane===lane){g.used=true;if(g.op==='+')power+=g.v;if(g.op==='×')power*=g.v;if(g.op==='-')power=Math.max(1,power-g.v);if(g.op==='÷')power=Math.max(1,Math.floor(power/g.v));burst(lanes[lane],560,g.op==='-'||g.op==='÷'?'bad':'good');updateHud()}}
 for(const e of enemies){if(e.hit)continue;for(const b of bullets){if(Math.abs(b.z-e.z)<35&&b.lane===e.lane){e.hp-=Math.max(1,power*.035);b.z=999999;if(e.hp<=0){e.hit=true;power+=2;burst(lanes[e.lane],project(e.z).y,'good');updateHud()}break}}}
}
function burst(px,py,type){for(let i=0;i<12;i++)fx.push({x:px,y:py,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.65,type})}
function updateFx(dt){fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});fx=fx.filter(p=>p.life>0)}
function road(){
 x.clearRect(0,0,420,700);
 let g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,'#79d2ff');g.addColorStop(.28,'#d5f3ff');g.addColorStop(.29,'#8ed17d');g.addColorStop(1,'#d7a16f');x.fillStyle=g;x.fillRect(0,0,420,700);
 x.fillStyle='#c58c5d';x.beginPath();x.moveTo(150,110);x.lineTo(20,700);x.lineTo(400,700);x.lineTo(270,110);x.closePath();x.fill();
 x.strokeStyle='#ffffff88';x.lineWidth=4;for(const xx of [180,240]){x.beginPath();x.moveTo(210+(xx-210)*.25,110);x.lineTo(xx+(xx-210)*1.65,700);x.stroke()}
}
function drawGate(g){
 const p=project(g.z);if(g.z-progress< -70||g.z-progress>780)return;const px=lanes[g.lane],w=76*p.s,h=50*p.s,bad=g.op==='-'||g.op==='÷';
 x.globalAlpha=g.used?.22:1;x.fillStyle=bad?'#ef5f67':'#53c977';x.fillRect(px-w/2,p.y-h/2,w,h);x.fillStyle='#fff';x.font='900 '+Math.max(14,27*p.s)+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(g.op+g.v,px,p.y);x.globalAlpha=1
}
function drawEnemy(e){
 if(e.hit)return;const p=project(e.z);if(e.z-progress< -60||e.z-progress>780)return;const px=lanes[e.lane];
 x.fillStyle='#d94b4b';x.fillRect(px-24*p.s,p.y-20*p.s,48*p.s,40*p.s);x.fillStyle='#fff';x.font='900 '+Math.max(11,17*p.s)+'px system-ui';x.textAlign='center';x.fillText(Math.max(0,Math.ceil(e.hp)),px,p.y+2)
}
function drawBullets(){x.fillStyle='#fff86b';for(const b of bullets){const p=project(b.z);x.beginPath();x.arc(lanes[b.lane],p.y,5*p.s+2,0,Math.PI*2);x.fill()}}
function drawPlayer(){
 const px=lanes[lane];x.save();x.translate(px,592);x.fillStyle='#2d65db';x.fillRect(-25,-28,50,46);x.fillStyle='#173e9e';x.fillRect(-18,18,14,24);x.fillRect(4,18,14,24);x.fillStyle='#ffd45c';x.beginPath();x.arc(0,-30,18,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='900 13px system-ui';x.textAlign='center';x.fillText(Math.floor(power),0,-2);x.restore()
}
function drawFx(){for(const p of fx){x.globalAlpha=Math.max(0,p.life/.65);x.fillStyle=p.type==='bad'?'#ff6a6a':'#fff06a';x.fillRect(p.x,p.y,5,5)}x.globalAlpha=1}
function finish(){
 running=false;const win=power>=target;$('title').textContent=win?'🏆 타워 파괴 성공!':'💥 화력이 부족했어!';
 $('msg').innerHTML='최종 화력 <b>'+Math.floor(power)+'</b> · 목표 <b>'+target+'</b><br>'+(win?'다음 단계는 더 강한 적이 기다려요.':'마이너스 게이트를 피하고 배수 게이트를 노려보세요.');
 $('start').textContent=win?'다음 단계':'다시 도전';if(win)stage++;$('overlay').classList.remove('hidden')
}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;progress+=speed*dt;fire(dt);collide();updateFx(dt);road();[...gates].sort((a,b)=>b.z-a.z).forEach(drawGate);enemies.forEach(drawEnemy);drawBullets();drawPlayer();drawFx();updateHud();if(progress>=length){finish();return}requestAnimationFrame(loop)}
function start(){reset();running=true;last=performance.now();$('overlay').classList.add('hidden');requestAnimationFrame(loop)}
$('start').addEventListener('click',start);$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));
let sx=null;c.addEventListener('pointerdown',e=>sx=e.clientX);c.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>24)move(dx>0?1:-1);sx=null});
reset();road();drawPlayer();
})();
</script>
</body></html>
