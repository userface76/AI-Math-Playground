<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#6757e8"/><title>AI Math Playground</title><link rel="stylesheet" href="styles.css"/></head><body><main class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div><strong>수키 수학놀이터</strong><small>AI Math Playground</small></div></div><div class="top-actions"><div class="star-pill">⭐ <span id="stars">0</span></div><button id="authBtn" class="auth-btn" aria-label="Google 로그인"><span id="authIcon">G</span><span id="authText">로그인</span></button><button id="parentBtn" class="icon-btn" aria-label="부모 리포트">📊</button></div></header><div id="authNotice" class="auth-notice hidden"></div><div class="level-card"><div><b id="level">Lv.1</b><span>수키와 함께 성장 중</span></div><div class="xp-track"><div id="xpBar"></div></div></div>
<section id="world" class="screen"><div class="hero"><div class="hero-glow"></div><div class="world-avatar"><img id="worldSuki" src="public/assets/suki/suki_10_explore.png" alt="탐험하는 수키"/></div><div class="speech-bubble">오늘은 어디로 모험 갈까?</div></div><div class="section-head"><div><p id="worldNumber" class="eyebrow">WORLD</p><h1 id="worldTitle">수학 세계를 불러오는 중...</h1></div><span class="progress-badge">모험중</span></div><p id="worldCopy" class="world-copy">수키와 함께 모험을 시작해보자!</p><div id="worldTabs" class="world-tabs"></div><div class="map-title"><b>오늘의 스테이지</b><span>하나씩 즐겨보자 ✨</span></div><div id="stageMap" class="stage-map"></div></section>
<section id="game" class="screen game-stage hidden"><div class="game-nav"><button id="mapBtn" class="back-btn">‹ 지도</button><div class="mission-mini"><span>⭐ <span id="missionStars">0</span>/20</span><div class="mission-track"><div id="missionBar"></div></div></div></div><div id="avatarLayer" class="avatar-layer" aria-live="polite"><div class="avatar-shadow"></div><div id="mascot" class="floating-avatar" aria-label="수키"><img id="sukiImage" alt="수키 AI 친구" hidden/><div id="sukiFallback" class="suki-fallback">✨<span>☁️</span>✨</div></div></div><div class="game-panel"><p id="mode" class="mode">수키랑 놀기</p><h1 id="speech">준비됐어?</h1><div id="visual" class="visual"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><button id="startBtn" class="primary">게임 시작!</button><button id="hintBtn" class="secondary hidden">💡 수키 힌트</button><button id="treasureBtn" class="treasure hidden">🎁 보물상자 열기</button></div></section>
<section id="parentPanel" class="screen parent-screen hidden"><div class="section-head"><div><p class="eyebrow">PARENT</p><h1>오늘의 학습 리포트</h1></div><span class="progress-badge">AI 분석</span></div><p class="world-copy">점수보다 아이가 어떻게 생각하고 다시 시도했는지 보여드려요.</p><div class="stats"><div><b id="attempts">0</b><span>도전</span></div><div><b id="correct">0</b><span>해결</span></div><div><b id="hints">0</b><span>힌트</span></div></div><p id="parentSummary" class="summary"></p><button id="backBtn" class="primary">수키에게 돌아가기</button></section><nav class="bottom-nav" aria-label="주요 메뉴"><button class="nav-item active" data-nav="world"><span>🗺️</span><b>모험</b></button><button class="nav-item" data-nav="play"><span>🎮</span><b>놀이</b></button><button class="nav-item" data-nav="treasure"><span>🎁</span><b>보물</b></button><button class="nav-item" data-nav="league"><span>🏆</span><b>리그</b></button></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="src/engines/adaptive-engine.js"></script><script src="app.js"></script></body></html>
