<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7868e6" />
  <title>AI Math Playground</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><strong>⭐ <span id="stars">0</span></strong><small>별</small></div>
      <div class="level"><span id="level">Lv.1</span><div class="xp-track"><div id="xpBar"></div></div></div>
      <button id="parentBtn" class="icon-btn" aria-label="부모 리포트">📊</button>
    </header>

    <section id="game" class="card game-stage">
      <div id="avatarLayer" class="avatar-layer" aria-live="polite">
        <div class="avatar-shadow"></div>
        <div id="mascot" class="floating-avatar" aria-label="수키">
          <img id="sukiImage" alt="수키 AI 친구" hidden />
          <div id="sukiFallback" class="suki-fallback">✨<span>☁️</span>✨</div>
        </div>
      </div>
      <div class="game-content">
        <p id="mode" class="mode">수키랑 놀기</p>
        <h1 id="speech">안녕! 나랑 숫자놀이 할래?</h1>
        <div id="visual" class="visual">⭐⭐⭐</div>
        <div id="question" class="question"></div>
        <div id="answers" class="answers"></div>
        <button id="startBtn" class="primary">좋아! 시작하자</button>
        <button id="hintBtn" class="secondary hidden">💡 힌트 줄까?</button>
      </div>
    </section>

    <section id="parentPanel" class="card hidden">
      <h2>오늘의 학습 리포트</h2>
      <p>아이에게는 놀이, 보호자에게는 학습 데이터로 보여줍니다.</p>
      <div class="stats">
        <div><b id="attempts">0</b><span>도전</span></div>
        <div><b id="correct">0</b><span>스스로 해결</span></div>
        <div><b id="hints">0</b><span>힌트</span></div>
      </div>
      <p id="parentSummary" class="summary">아직 오늘의 놀이를 시작하지 않았어요.</p>
      <button id="backBtn" class="primary">수키에게 돌아가기</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
